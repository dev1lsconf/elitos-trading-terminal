# Render Blueprint - Deploy Elitos Trading Terminal usando Docker
# Uso: push a GitHub -> conectar repo en Render -> "New Blueprint Instance"
# Esto usa Dockerfile multi-stage (Node para build + Python para runtime)

services:
  - type: web
    name: elitos-trading-terminal
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FLASK_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: "5000"
    healthCheckPath: /api/market-status

# NOTAS:
# - Dockerfile maneja: Node build (Vite) + Python runtime (Gunicorn)
# - Puerto interno 5000, Render mapea al PORT público
# - dist/ se copia en la imagen durante build
# - Más confiable que runtime: python + buildCommand mixto